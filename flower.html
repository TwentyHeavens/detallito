      /* Reset completo de la clase titulo para evitar apilamiento o letras apretadas */
      h1.titulo, 
      .titulo,
      h1.titulo *,
      .titulo * {
        display: inline !important;
        position: static !important;
        float: none !important;
        clear: none !important;
        letter-spacing: normal !important;
        word-spacing: normal !important;
        writing-mode: horizontal-tb !important;
        text-orientation: mixed !important;
        white-space: normal !important;
        font-size: 1.1rem !important;
        line-height: 1.4 !important;
        color: #ffe600 !important;
      }

      /* Contenedor principal del título para fijarlo en la parte superior */
      h1.titulo, .titulo {
        display: block !important;
        position: fixed !important;
        top: 20px !important;
        left: 50% !important;
        transform: translateX(-50%) !important;
        width: 85% !important;
        max-width: 500px !important;
        margin: 0 auto !important;
        padding: 0 !important;
        z-index: 2000 !important;
        text-align: center !important;
        text-shadow: 0 0 8px rgba(0, 0, 0, 0.9), 0 0 4px #000 !important;
        cursor: pointer;
      }

      /* Contenedor flotante de imágenes para no alterar el layout general */
      .animales-container {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        pointer-events: none;
        z-index: 800;
        overflow: hidden;
      }

      .abeja, .loro, .roblox { 
        position: absolute; 
        pointer-events: none; 
      }

      /* Estilos para Abejas */
      .abeja { 
        width: 35px; 
        height: auto; 
        animation: flotarAbeja 2.5s ease-in-out infinite alternate;
      }
      .abeja--1 { top: 18%; left: 5%; animation-delay: 0s; }
      .abeja--2 { top: 22%; right: 5%; animation-delay: 0.4s; }
      .abeja--3 { top: 48%; left: 8%; animation-delay: 0.8s; }
      .abeja--4 { top: 58%; right: 8%; animation-delay: 1.2s; }
      .abeja--5 { top: 78%; left: 8%; animation-delay: 0.6s; }
      .abeja--6 { top: 82%; right: 12%; animation-delay: 1.5s; }

      @keyframes flotarAbeja {
        0% { transform: translateY(0px); }
        100% { transform: translateY(-10px); }
      }

      /* Estilos para Loros */
      .loro { 
        width: 32px; 
        height: auto; 
        animation: flotarLoro 2.5s ease-in-out infinite alternate;
      }
      .loro--1 { top: 12%; left: 10%; transform: scaleX(1); animation-delay: 0s; }
      .loro--2 { top: 20%; right: 15%; animation-name: flotarLoroVolteado; animation-delay: 0.4s; }
      .loro--3 { top: 40%; left: 5%; transform: scaleX(1); animation-delay: 0.8s; }

      .loro--6 { top: 85%; right: 18%; transform: scaleX(1); animation-delay: 1.5s; }

      @keyframes flotarLoro {
        0% { transform: translateY(0px) scaleX(1); }
        100% { transform: translateY(-10px) scaleX(1); }
      }
      @keyframes flotarLoroVolteado {
        0% { transform: translateY(0px) scaleX(-1); }

      }

    <!-- Control de música ultra suave (Smooth Fade-In en 2 segundos) y redirección a WhatsApp -->
    <script>
      const music = document.getElementById("music");
      const savedTime = localStorage.getItem("musicTime");
      
      const whatsappURL = "https://api.whatsapp.com/send/?phone=526862462143&text=Muchas+gracias%2C+mi+amor.+Te+amo%2C+eres+lo+mas+bonito+que+me+ha+pasado%2C+soy+muy+afortunada.&type=phone_number&app_absent=0";

      let audioCtx = null;
      let gainNode = null;
      let isPlayingWithAudioApi = false;

      // Inicia la música con rampa exponencial/lineal suave usando Web Audio API
      function iniciarFadeInUltraSuave() {
        if (!music) return;

        // Si ya está reproduciendo de forma fluida, no reiniciar
        if (isPlayingWithAudioApi) return;

        try {
          // Crear contexto de audio si no existe
          if (!audioCtx) {
            const AudioContext = window.AudioContext || window.webkitAudioContext;
            audioCtx = new AudioContext();
            const source = audioCtx.createMediaElementSource(music);
            gainNode = audioCtx.createGain();
            source.connect(gainNode);
            gainNode.connect(audioCtx.destination);
          }

          if (audioCtx.state === "suspended") {
            audioCtx.resume();
          }

          const now = audioCtx.currentTime;
          // Iniciar la ganancia (volumen) en cero absoluto
          gainNode.gain.setValueAtTime(0, now);
          // Rampa ultra suave desde 0 hasta 1 en exactamente 2.0 segundos
          gainNode.gain.linearRampToValueAtTime(1, now + 2.0);

          music.play().then(() => {
            isPlayingWithAudioApi = true;
          }).catch(() => {
            // Autoplay restringido hasta que el usuario toque la pantalla
          });
        } catch (e) {
          // Fallback con intervalos si la Web Audio API no está disponible
          music.volume = 0;
          music.play().catch(() => {});
          let start = Date.now();
          let timer = setInterval(() => {
            let timePassed = Date.now() - start;
            if (timePassed >= 2000) {
              music.volume = 1;
              clearInterval(timer);
            } else {
              music.volume = timePassed / 2000;
            }
          }, 20);
        }
      }

      // Restaurar el tiempo guardado
      music.addEventListener("loadedmetadata", () => {
        if (savedTime) {
          music.currentTime = parseFloat(savedTime);
        }
        iniciarFadeInUltraSuave();
      });

      window.addEventListener("load", () => {
        iniciarFadeInUltraSuave();
      });

      let redirigiendo = false;

      function irAWhatsApp() {
        // Asegurar inicio del audio con fade-in si el navegador lo bloqueó
        if (music.paused || !isPlayingWithAudioApi) {
          iniciarFadeInUltraSuave();
        }

        if (redirigiendo) return;
        redirigiendo = true;

        if (music) {
          localStorage.setItem("musicTime", music.currentTime);
        }

        window.location.href = whatsappURL;
      }

      // Capturar toque o clic para iniciar suavemente y redirigir
      document.addEventListener("touchstart", irAWhatsApp, { passive: true });
      document.addEventListener("click", irAWhatsApp);

      // Guardar progreso continuamente
      music.addEventListener("timeupdate", () => {
        localStorage.setItem("musicTime", music.currentTime);
      });

      music.addEventListener("ended", () => {
        localStorage.removeItem("musicTime");
      });
    </script>
